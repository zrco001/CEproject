name: Local gate permission diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Trace endpoint names only for the existing document-only PR
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.github/ai-loop')
          import controller as c
          import local_review_gate as gate
          original = c.gh
          def trace(path, method='GET', body=None):
              print(f'GitHub endpoint: {method} {path}', flush=True)
              return original(path, method, body)
          c.gh = trace
          gate.main()
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          PR_NUMBER: '4'
