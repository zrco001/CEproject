name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    env:
      # CI-only placeholder credentials for throwaway containers. Never production secrets.
      POSTGRES_PASSWORD: ci-placeholder-postgres-password
      S3_ACCESS_KEY_ID: ci-placeholder-minio-user
      S3_SECRET_ACCESS_KEY: ci-placeholder-minio-password
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Validate compose file
        run: docker compose --profile app config --quiet

      - name: Build api + web images
        run: docker compose --profile app build

      - name: Runtime smoke test
        run: sh scripts/ci/docker-smoke.sh

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v --remove-orphans
