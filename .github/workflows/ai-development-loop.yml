name: Local gate permission diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish-fix, check-fix]
        required: true
        default: check-fix
      pr_number:
        type: string
        default: '4'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Package the exact verified permission fix or check its review gate
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.github/ai-loop')
          import controller as c
          import local_review_gate as gate
          import os
          c.maintainers_only()
          c.require_protection()
          if os.environ['FIX_MODE'] == 'publish-fix':
              import base64
              branch = 'codex/local-review-gate-permissions'
              prepared = 'dd6cb83ade43ea1a8dfec56ee499d7f914cdf2c1'
              commit = c.gh(f'commits/{prepared}')
              assert commit['sha'] == prepared
              assert [p['sha'] for p in commit['parents']] == ['de85cd7d32fe3c2c3f139a43e27ea228344088a4']
              assert len(commit['files']) == 1
              path = '.github/workflows/ai-development-loop.yml'
              assert commit['files'][0]['filename'] == path
              before = base64.b64decode(c.gh(f'contents/{path}?ref=main')['content']).decode()
              after = base64.b64decode(c.gh(f'contents/{path}?ref={commit["sha"]}')['content']).decode()
              expected = before.replace('      pull-requests: read\n', '      # Write permission lets the trusted gate publish its PR conversation result.\n      # This job never submits APPROVE reviews or calls the merge API.\n      pull-requests: write\n')
              assert before != expected and after == expected
              # The final reviewable push must be independent of the human reviewer.
              # Publish only this already prepared descendant; never force-push.
              assert c.gh(f'commits/{branch}')['sha'] == 'de85cd7d32fe3c2c3f139a43e27ea228344088a4'
              c.gh(f'git/refs/heads/{branch}', 'PATCH', {'sha': prepared, 'force': False})
              existing = c.gh(f'pulls?state=open&head=zrco001:{branch}')
              if existing:
                  print(existing[0]['html_url'])
              else:
                  pr = c.gh('pulls', 'POST', {
                      'head': branch, 'base': 'main', 'draft': True,
                      'title': 'fix: allow local review gate to post PR results',
                      'body': 'The local review gate completed its evidence checks but GitHub rejected its PR conversation comment with HTTP 403. Grant pull-requests: write to this trusted-main job so it can publish the result. It still never executes PR code, submits APPROVE reviews, merges, or calls model APIs.\n\nValidation: the same real PR #4 gate failed with read permission (run 37532802679), then passed with write permission (run 37532874272). All 41 guardrail tests and actionlint pass. Architecture, application code, database, and main protection remain unchanged. Workflow permission scope requires human approval before merge.'})
                  print(pr['html_url'])
          else:
              gate.main()
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FIX_MODE: ${{ inputs.mode }}
