name: AI Development Loop

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Start an issue task, or review a current PR head
        type: choice
        options: [review, start]
        default: review
      pr_number:
        description: PR number for review (same repository, base main)
        type: string
        default: ''
      issue_number:
        description: Open issue number for start (human maintainer only)
        type: string
        default: ''

# Serializes durable attempt reservations and publication across the repository.
# GitHub keeps one pending run; after bursts, manually review any PR left pending.
concurrency:
  group: ai-development-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    outputs:
      action: ${{ steps.plan.outputs.action }}
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: plan
        name: Verify CI, scope, current head, and attempt budget
        run: python .github/ai-loop/controller.py plan
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          AI_LOOP_ENABLED: ${{ vars.AI_LOOP_ENABLED }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
      - if: steps.plan.outputs.action == 'implement'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-plan
          path: plan.json
          retention-days: 3
          if-no-files-found: error

  implement:
    needs: plan
    if: needs.plan.outputs.action == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-plan
      - name: Create plain source snapshot without PR-controlled agent configuration
        run: python trusted/.github/ai-loop/agent.py snapshot
      - name: Build pinned Claude CLI image from trusted Dockerfile
        run: docker build -t ceproject-claude trusted/.github/ai-loop
      - name: Claude implementation (no GitHub credentials or shell tools)
        shell: bash
        run: |
          test -n "$ANTHROPIC_API_KEY"
          chmod -R a+rwX sandbox/repo
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /home/agent:rw,uid=1001,gid=1001 --tmpfs /tmp \
            -e ANTHROPIC_API_KEY \
            -v "$PWD/sandbox/repo:/repo:rw" \
            -i ceproject-claude < sandbox/prompt.txt > claude-result.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Reject protected, binary, symlink, oversized, or empty edits
        run: python trusted/.github/ai-loop/agent.py export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-changes
          path: changes.json
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [plan, implement]
    if: needs.plan.outputs.action == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      issues: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-changes
      - name: Independent risk check, atomic branch update, explicit CI dispatch
        run: python .github/ai-loop/controller.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          AI_LOOP_ENABLED: ${{ vars.AI_LOOP_ENABLED }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}

  failure:
    needs: [plan, implement, publish]
    if: always() && contains(needs.*.result, 'failure') && needs.plan.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed and require human intervention
        run: python .github/ai-loop/controller.py failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
