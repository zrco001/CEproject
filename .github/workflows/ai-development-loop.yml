name: Publish reviewed sidebar CTA proposal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publish only the exact locally reviewed ordinary UI commit
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.github/ai-loop')
          import controller as c
          c.maintainers_only()
          c.require_protection()
          base = '802ae738403ceb2965ae29b610e30bc62b4a7ade'
          prepared = 'b34bf9219af1bb296663196f42d8b708c358e27e'
          path = 'apps/web/src/components/shell/sidebar.tsx'
          branch = 'claude/phase-1-sidebar-cta'
          assert c.gh('commits/main')['sha'] == base, 'Main advanced: stop for re-review'
          commit = c.gh(f'commits/{prepared}')
          assert [p['sha'] for p in commit['parents']] == [base]
          assert len(commit['files']) == 1
          file = commit['files'][0]
          assert file['filename'] == path and file['status'] == 'modified'
          assert file['sha'] == '7325a9438a5cddf7e8b62a012afa464d0208cce2'
          assert c.gh(f'contents/docs/ARCHITECTURE.md?ref={prepared}')['sha'] == '73aafe2ae0ca175117de08bb37e52b465c42b0ea'
          refs = c.gh(f'git/matching-refs/heads/{branch}')
          exact = [r for r in refs if r['ref'] == f'refs/heads/{branch}']
          if exact:
              assert len(exact) == 1 and exact[0]['object']['sha'] == prepared
          else:
              c.gh('git/refs', 'POST', {'ref': f'refs/heads/{branch}', 'sha': prepared})
          existing = c.gh(f'pulls?state=open&head=zrco001:{branch}')
          if existing:
              assert existing[0]['head']['sha'] == prepared and existing[0]['draft']
              print(existing[0]['html_url'])
          else:
              pr = c.gh('pulls', 'POST', {
                  'head': branch, 'base': 'main', 'draft': True,
                  'title': 'fix(web): meet sidebar quick-add CTA touch size',
                  'body': 'The tablet and desktop sidebar Quick Add buttons were 48px high; the tablet button was also only 55px wide. Architecture P1-11 requires 56px CTA targets. Use the existing CTA variant and tablet-only spacing to make the tablet button 63x56 and desktop height 56px. Only sidebar.tsx changes; labels, navigation, dialog behavior and business rules stay unchanged.\n\nClaude Pro proposed this patch in two bounded local attempts. Codex independently reviewed it, sent the width finding back, and verified the final UI in Edge at 375/767/768/1023/1024/1440px: correct navigation breakpoints, CTA sizes, no document horizontal overflow, and Quick Add opening/closing. Existing web tests, lint, typecheck and formatting passed locally. Full CI and exact-head local review gate follow publication. iOS Safari safe-area and DB/runtime acceptance remain outside this UI fix.\n\nNo model API billing, sensitive data changes, migration or automatic merge. Human approval and final merge remain required.'})
              print(pr['html_url'])
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
