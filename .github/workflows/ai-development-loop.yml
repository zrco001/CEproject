name: AI Development Loop
on:
  workflow_dispatch:
    inputs:
      mode:
        description: One-time no-API packaging or exact-head review after CI
        type: choice
        options: [publish-free, review-free]
        default: review-free
permissions:
  contents: read
jobs:
  local-subscription-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package or check only two exact prepared commits; no model keys or calls
        run: python .github/ai-loop/package_activation_fix.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          FIX_MODE: ${{ inputs.mode }}
