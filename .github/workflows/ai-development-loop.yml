name: AI Development Loop

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to check after local review or human approval
        type: string
        required: true

concurrency:
  group: ai-development-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local-review-gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type == 'User' && startsWith(github.event.comment.body, '<!-- local-ai-review -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Write permission lets the trusted gate publish its PR conversation result.
      # This job never submits APPROVE reviews or calls the merge API.
      pull-requests: write
      issues: write
      statuses: write
      actions: read
    steps:
      # Only trusted main code. Never check out or execute PR code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact-head local review, CI, and human guardrails (no model APIs)
        run: python .github/ai-loop/local_review_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
