name: Single-maintainer setup bootstrap (no merge)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Fixed settings PR 11 only; this workflow never merges
        required: true
        default: '11'
        type: string

permissions:
  contents: read

concurrency:
  group: ai-development-loop
  cancel-in-progress: false

jobs:
  fixed-settings-gate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/single-maintainer-bootstrap' &&
      inputs.pr_number == '11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for publishing the trusted gate result in the PR conversation.
      # The fixed script never submits APPROVE reviews or calls the merge API.
      pull-requests: write
      issues: write
      statuses: write
      actions: read
    steps:
      # Fixed independently reviewed settings commit, never an input-selected PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0e5d9d49d7b24342f46e596386fdcebcf0f11842
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify actual fixed-head Codex review, owner approval, CI and protection
        run: python .github/ai-loop/bootstrap_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          BOOTSTRAP_PR: '11'
          BOOTSTRAP_HEAD: 0e5d9d49d7b24342f46e596386fdcebcf0f11842
          BOOTSTRAP_BASE: 132ca23e6da017d9d716afe7428d67e9c327a97b
          BOOTSTRAP_FILES_SHA256: 2dd6d153dcc7e52ba55d436ed40df795cfa567f500ab44ed13dd691353a8e34e
