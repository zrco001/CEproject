name: AI Development Loop
on:
  workflow_dispatch:
    inputs:
      mode:
        description: One-time operator diagnostics or exact activation fix review
        type: choice
        options: [diagnose, publish-fix, review-fix]
        default: diagnose
permissions:
  contents: read
jobs:
  activation-probe:
    if: inputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only endpoint diagnostics without credential output
        run: python .github/ai-loop/activation_probe.py
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
  activation-fix:
    if: inputs.mode == 'publish-fix' || inputs.mode == 'review-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publish or evaluate the exact fix after human approval and CI
        run: python .github/ai-loop/package_activation_fix.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROTECTION_READ_TOKEN: ${{ secrets.AI_PROTECTION_READ_TOKEN }}
          FIX_MODE: ${{ inputs.mode }}
